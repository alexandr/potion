<!doctype html>
<html><head><meta charset="utf-8"><title>Potion</title>
<script>
  // Single Page App redirect for GitHub Pages: keep the path, load index.html
  sessionStorage.setItem('potion-redirect', location.pathname + location.search + location.hash);
  var base = location.hostname.endsWith('github.io') ? location.pathname.split('/').slice(0, 2).join('/') + '/' : '/';
  location.replace(location.origin + base);
</script></head><body></body></html>
